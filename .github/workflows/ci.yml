name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Kofun verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install AArch64 user-mode emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user
      - run: task verify
      - name: Build and run Kofun Core
        run: |
          ./bin/kofun build bootstrap/fixtures/answer.kofun -o build/answer
          test "$(./build/answer)" = "42"

  # The committed snapshot is a fixture. `task backlog`, inside `task verify`,
  # checks it on every pull request and is deterministic: it fails only when
  # the change breaks the rules or the ledger.
  #
  # This lane checks the *live* backlog, and deliberately does not run on pull
  # requests. Issues are filed here every few minutes, so a `ready` issue
  # opened by someone else while a PR is in review would turn that PR red for a
  # reason its author cannot fix. On `main` the same failure is a true signal
  # that the backlog needs attention, and it is actionable by whoever owns it.
  #
  # It also verifies the evidence stamps, which needs the full history that the
  # shallow default checkout does not have.
  backlog:
    name: Backlog issue state
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh from GitHub and check the live backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task backlog-refresh

  # `task native-host-evidence` also runs inside `task verify`, where it checks
  # everything about the six observations except where they came from: the
  # verify checkout is shallow and has no token, so the evidence commit cannot
  # be resolved and the workflow run cannot be looked up. The gate says so on
  # stderr rather than passing quietly.
  #
  # This lane is the one that can actually resolve them, so it is the one that
  # enforces the binding. Unlike the live-backlog lane it runs on pull requests
  # too, because nothing here depends on state that other people change: the
  # evidence artifact is committed, and the workflow run it names either exists
  # on that commit or does not.
  native-host-binding:
    name: Native host evidence binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the evidence commit and workflow run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task native-host-evidence

  # The structural lane above (`task release-claims`, inside `task verify`) only
  # reads the repository. This lane proves the stronger property: a checkout
  # that has installed nothing regenerates the committed evidence pack byte for
  # byte. It runs separately so a stale pack is not reported as a verify
  # failure among fifty other gates.
  release-evidence:
    name: Release evidence pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate the evidence pack
        run: task release-evidence
      - name: Require the committed pack to match
        run: git diff --exit-code -- artifacts/release-evidence
