name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Kofun verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install AArch64 user-mode emulator and the compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user ccache
      # Two thirds of `task verify` is `cc`, and most of that recompiles source
      # sets an earlier gate already built. The cache is restored across runs,
      # so a change to one translation unit no longer rebuilds the rest.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-verify-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-verify-${{ runner.os }}-
      - name: Front the compilers with the cache
        run: |
          sh tooling/ccache-masquerade.sh >>"$GITHUB_PATH"
          ccache --zero-stats
      # The masquerade must stay invisible to the recorded toolchain identity:
      # `generations-lib.sh` derives `compiler_identity` from `--version`, and
      # `bootstrap/manifest.json` pins it for the closure measurement. ccache
      # forwards `--version` to the compiler it fronts; this proves it did
      # rather than assuming it, and fails the run before any gate if not.
      - name: Prove the cache is transparent to the toolchain identity
        run: |
          identity=$(cc --version | head -n 1)
          printf 'cc --version through the cache: %s\n' "$identity"
          case "$identity" in
            *ccache*)
              printf '%s\n' "the masquerade leaked into --version" >&2
              exit 1
              ;;
          esac
          # `selfhost-diverse-double-compilation` needs two genuinely different
          # compiler binaries: a payload inside one host compiler cannot be
          # caught by a chain that only ever runs that compiler. Fronting gcc
          # and clang as well as cc collapsed them into one and the gate
          # refused, correctly. Prove that has not happened again here, before
          # forty other gates run, rather than in the middle of the suite.
          gcc_path=$(command -v gcc || true)
          clang_path=$(command -v clang || true)
          if test -n "$gcc_path" && test -n "$clang_path" &&
             test "$(readlink -f "$gcc_path")" = "$(readlink -f "$clang_path")"
          then
            printf '%s\n' \
              "gcc and clang resolve to one binary; the diverse pair is gone" >&2
            exit 1
          fi
          printf 'gcc: %s\nclang: %s\n' \
            "$(readlink -f "$gcc_path")" "$(readlink -f "$clang_path")"
      - run: task verify
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Build and run Kofun Core
        run: |
          ./bin/kofun build bootstrap/fixtures/answer.kofun -o build/answer
          test "$(./build/answer)" = "42"

  # The committed snapshot is a fixture. `task backlog`, inside `task verify`,
  # checks it on every pull request and is deterministic: it fails only when
  # the change breaks the rules or the ledger.
  #
  # This lane checks the *live* backlog, and deliberately does not run on pull
  # requests. Issues are filed here every few minutes, so a `ready` issue
  # opened by someone else while a PR is in review would turn that PR red for a
  # reason its author cannot fix. On `main` the same failure is a true signal
  # that the backlog needs attention, and it is actionable by whoever owns it.
  #
  # It also verifies the evidence stamps, which needs the full history that the
  # shallow default checkout does not have.
  backlog:
    name: Backlog issue state
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh from GitHub and check the live backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task backlog-refresh

  # The structural lane above (`task release-claims`, inside `task verify`) only
  # reads the repository. This lane proves the stronger property: a checkout
  # that has installed nothing regenerates the committed evidence pack byte for
  # byte. It runs separately so a stale pack is not reported as a verify
  # failure among fifty other gates.
  release-evidence:
    name: Release evidence pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate the evidence pack
        run: task release-evidence
      - name: Require the committed pack to match
        run: git diff --exit-code -- artifacts/release-evidence
